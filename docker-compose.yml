services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      php:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ./:/var/www/html:ro
      - ./public/uploads:/var/www/html/public/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ru || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Rangrez Restaurant}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Укажите APP_KEY в production env-файле}
      APP_URL: ${APP_URL:?Укажите APP_URL в production env-файле}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_DRIVER: file
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rangrez}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-rangrez}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Укажите DOCKER_DB_PASSWORD в production env-файле}
      FILESYSTEM_DRIVER: local
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Укажите ADMIN_EMAIL в production env-файле}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Укажите ADMIN_PASSWORD в production env-файле}
    networks:
      - internal
    volumes:
      - ./:/var/www/html:ro
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./public/uploads:/var/www/html/public/uploads
      - ./storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rangrez}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-rangrez}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Укажите DOCKER_DB_PASSWORD в production env-файле}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Укажите DOCKER_DB_ROOT_PASSWORD в production env-файле}
    networks:
      - internal
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  database_data:

networks:
  internal:
    driver: bridge
